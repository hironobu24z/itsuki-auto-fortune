<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タロットあんちょこ</title>
<style>
:root{
  --bg:#fbfaf7; --panel:#fff; --ink:#1f1d1a; --sub:#6f6a61; --line:#e5e0d6;
  --accent:#6d3f8f; --soft:#f2ebf7; --rev:#b0562e; --shadow:0 1px 3px rgba(0,0,0,.05);
}
:root:not([data-theme="light"]){@media(prefers-color-scheme:dark){
  --bg:#15141a; --panel:#1f1e26; --ink:#efece6; --sub:#a39e95; --line:#33313c;
  --accent:#c49bec; --soft:#2a2334; --rev:#e0885a; --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#15141a; --panel:#1f1e26; --ink:#efece6; --sub:#a39e95; --line:#33313c;
  --accent:#c49bec; --soft:#2a2334; --rev:#e0885a; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.75;
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  padding:16px 14px 70px;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto}
header{margin-bottom:14px}
h1{font-size:1.05rem;margin:0;letter-spacing:.06em}
.sub{font-size:.75rem;color:var(--sub);margin:2px 0 0}

/* タブ */
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:10px 4px;background:none;border:0;border-bottom:2px solid transparent;
  color:var(--sub);font-size:.85rem;font-family:inherit;font-weight:600;cursor:pointer;letter-spacing:.04em}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}

/* 共通 */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;
  margin-bottom:14px;box-shadow:var(--shadow)}
label{display:block;font-size:.74rem;color:var(--sub);margin-bottom:5px;letter-spacing:.05em}
input[type=text],select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--ink);font-size:.92rem;font-family:inherit}
.btn{padding:12px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;
  font-size:.88rem;font-weight:600;font-family:inherit;cursor:pointer;letter-spacing:.05em}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;margin-top:12px}
.row .btn{flex:1}
.hide{display:none !important}

/* 一覧 */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:7px 13px;background:var(--panel);border:0;color:var(--sub);
  font-size:.76rem;font-family:inherit;font-weight:600;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.thumb{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 5px;
  text-align:center;cursor:pointer;transition:border-color .12s}
.thumb:active{border-color:var(--accent)}
.thumb .ph{aspect-ratio:100/171;border-radius:5px;overflow:hidden;background:var(--soft);
  display:flex;align-items:center;justify-content:center;margin-bottom:5px}
.thumb .ph img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph span{font-size:.95rem;font-weight:700;color:var(--accent);letter-spacing:.04em}
.thumb b{display:block;font-size:.76rem;font-weight:600}
.thumb i{display:block;font-size:.64rem;color:var(--sub);font-style:normal}

/* 詳細 */
.detail{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:40;
  padding:16px 14px 60px;-webkit-overflow-scrolling:touch}
.close{position:sticky;top:0;float:right;background:var(--panel);border:1px solid var(--line);
  color:var(--ink);border-radius:99px;width:34px;height:34px;font-size:1.1rem;cursor:pointer;
  font-family:inherit;line-height:1;z-index:2}
.dhead{display:flex;gap:14px;margin-bottom:16px;align-items:flex-start}
.dhead .ph{width:104px;flex-shrink:0;aspect-ratio:100/171;border-radius:7px;overflow:hidden;
  background:var(--soft);display:flex;align-items:center;justify-content:center}
.dhead .ph img{width:100%;height:100%;object-fit:cover;display:block}
.dhead .ph span{font-size:1.4rem;font-weight:700;color:var(--accent)}
.dhead .ph.rev img{transform:rotate(180deg)}
.dname{font-size:1.35rem;font-weight:700;letter-spacing:.04em;margin:0}
.den{font-size:.72rem;color:var(--sub);margin:0 0 8px}
.kw{display:flex;gap:5px;flex-wrap:wrap}
.kw span{font-size:.68rem;padding:2px 8px;border:1px solid var(--line);border-radius:99px;color:var(--sub)}
.ori{display:inline-block;font-size:.68rem;padding:2px 9px;border-radius:99px;
  background:var(--soft);color:var(--accent);font-weight:700;margin-bottom:6px}
.ori.r{color:var(--rev);background:transparent;border:1px solid var(--rev)}
.mrow{border-top:1px solid var(--line);padding:11px 0}
.mrow dt{font-size:.68rem;color:var(--sub);letter-spacing:.09em;margin-bottom:3px}
.mrow dd{margin:0;font-size:.9rem}
.guide{background:var(--soft);border-radius:8px;padding:11px 13px;font-size:.86rem;margin-top:10px}
.guide::before{content:"指針 ";font-size:.66rem;letter-spacing:.1em;color:var(--accent);font-weight:700}
.masked{filter:blur(5px);cursor:pointer;user-select:none}

/* 引く */
.card{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;
  background:var(--panel);box-shadow:var(--shadow)}
.pos{font-size:.68rem;letter-spacing:.11em;color:var(--accent);font-weight:700;margin-bottom:9px}
.cbody{display:flex;gap:13px}
.cbody .ph{width:78px;flex-shrink:0;aspect-ratio:100/171;border-radius:6px;overflow:hidden;
  background:var(--soft);display:flex;align-items:center;justify-content:center}
.cbody .ph img{width:100%;height:100%;object-fit:cover;display:block}
.cbody .ph.rev img{transform:rotate(180deg)}
.cbody .ph span{font-size:1.05rem;font-weight:700;color:var(--accent)}
.cname{font-size:1.1rem;font-weight:700;letter-spacing:.03em;margin:0 0 3px}
.meaning{font-size:.88rem;margin:8px 0 0}
.empty{color:var(--sub);font-size:.84rem;text-align:center;padding:34px 0}
#aiOut{white-space:pre-wrap;font-size:.92rem}
.note{font-size:.74rem;color:var(--sub);margin-top:9px}
.err{color:var(--rev);font-size:.82rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>タロットあんちょこ</h1>
    <p class="sub">大アルカナ22枚 ／ 正逆 × 5文脈</p>
  </header>

  <div class="tabs">
    <button class="tab on" data-tab="list">カード一覧</button>
    <button class="tab" data-tab="draw">引く</button>
  </div>

  <!-- ===== 一覧 ===== -->
  <section id="tab-list">
    <div class="toolbar">
      <div class="seg" id="segCtx"></div>
      <div class="seg">
        <button id="btnMask">暗記モード</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- ===== 引く ===== -->
  <section id="tab-draw" class="hide">
    <div class="panel">
      <label for="dName">お名前</label>
      <input type="text" id="dName" placeholder="いつき">
      <div style="margin-top:11px">
        <label for="dQ">相談内容</label>
        <input type="text" id="dQ" placeholder="例：今の仕事を続けるべきか">
      </div>
      <div style="margin-top:11px">
        <label for="dCtx">読む文脈</label>
        <select id="dCtx"></select>
      </div>
      <div class="row">
        <button class="btn" onclick="draw('one_oracle')">1枚引く</button>
        <button class="btn ghost" onclick="draw('three_card')">3枚引く</button>
      </div>
    </div>
    <div id="drawOut"><div class="empty">ボタンを押すとカードが出ます</div></div>
    <div class="panel hide" id="aiPanel">
      <button class="btn" id="aiBtn" style="width:100%" onclick="callAi()">AIに鑑定文を書いてもらう</button>
      <p class="note" id="aiNote">この操作だけ Gemini API を使います。カードと意味の表示までは無料です。</p>
      <button class="btn ghost" id="copyBtn" style="width:100%;margin-top:6px" onclick="copyPrompt()">プロンプトをコピー</button>
      <p class="note">ChatGPT や Claude にそのまま貼れる形でコピーします。API は使いません。</p>
      <div id="aiOut"></div>
    </div>
  </section>
</div>

<div class="detail hide" id="detail"></div>

/* ---- タブ ---- */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  $('tab-list').classList.toggle('hide', t.dataset.tab!=='list');
  $('tab-draw').classList.toggle('hide', t.dataset.tab!=='draw');
  window.scrollTo(0,0);
});

/* ---- 文脈セレクタ ---- */

  `<button data-k="${k}" class="${k===curCtx?'on':''}">${CTX[k].split('・')[0]}</button>`).join('');

  const b=e.target.closest('button'); if(!b) return;
  curCtx=b.dataset.k;
  $('segCtx').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  if(!$('detail').classList.contains('hide')) openCard(+$('detail').dataset.id);
};
$('dCtx').innerHTML = CTX_KEYS.map(k=>`<option value="${k}">${CTX[k]}</option>`).join('');

$('btnMask').onclick = ()=>{ masked=!masked; $('btnMask').classList.toggle('on',masked);
  if(!$('detail').classList.contains('hide')) openCard(+$('detail').dataset.id); };

/* ---- 一覧 ---- */
$('grid').innerHTML = DATA.cards.map(c=>
  `<div class="thumb" onclick="openCard(${c.id})">
     <div class="ph">${imgTag(c)}</div>
     <b>${c.name}</b><i>${c.number}</i>
   </div>`).join('');

/* ---- 詳細 ---- */
function openCard(id){
  const c = DATA.cards.find(x=>x.id===id);
  const d = $('detail'); d.dataset.id = id;
  const block = (o, rev) => `
    <span class="ori${rev?' r':''}">${rev?'逆位置':'正位置'}</span>
    <dl style="margin:0">
      ${CTX_KEYS.map(k=>`<div class="mrow"><dt>${CTX[k]}</dt>
        <dd class="${masked&&k!==curCtx?'masked':''}" onclick="this.classList.remove('masked')">${o[k]}</dd></div>`).join('')}
    </dl>
    <div class="guide">${o.guidance}</div>`;
  d.innerHTML = `<button class="close" onclick="closeCard()">×</button>
    <div class="dhead">
      <div class="ph">${imgTag(c)}</div>
      <div>
        <p class="dname">${c.name}</p>
        <p class="den">${c.name_en} ・ ${c.number}</p>
        <div class="kw">${c.keywords.map(k=>`<span>${k}</span>`).join('')}</div>
      </div>
    </div>
    <div style="margin-bottom:18px">${block(c.upright,false)}</div>
    <div>${block(c.reversed,true)}</div>`;
  d.classList.remove('hide'); d.scrollTop=0;
}
function closeCard(){ $('detail').classList.add('hide'); }

/* ---- 引く ---- */
function draw(spreadId){
  const sp = DATA.spreads.find(s=>s.id===spreadId);
  const ctx = $('dCtx').value;
  const pool = DATA.cards.slice();
  const buf = new Uint32Array(pool.length);
  crypto.getRandomValues(buf);
  for(let i=pool.length-1;i>0;i--){ const j=buf[i]%(i+1); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const flip = new Uint8Array(sp.card_count); crypto.getRandomValues(flip);
  const picks = pool.slice(0,sp.card_count).map((c,i)=>({card:c, reversed: flip[i]%2===1}));

  $('drawOut').innerHTML = picks.map((p,i)=>{
    const o = p.reversed ? p.card.reversed : p.card.upright;
    const label = sp.card_count>1 ? sp.positions[i].label : '答え';
    return `<div class="card">
      <div class="pos">${label}</div>
      <div class="cbody">
        <div class="ph${p.reversed?' rev':''}">${imgTag(p.card)}</div>
        <div>
          <p class="cname">${p.card.name}</p>
          <span class="ori${p.reversed?' r':''}">${p.reversed?'逆位置':'正位置'}</span>
          <p class="meaning">${o[ctx]}</p>
        </div>
      </div>
      <div class="guide">${o.guidance}</div>
    </div>`;
  }).join('');

  lastDraw = {
    mode:'tarot',
    name: $('dName').value.trim() || 'あなた',
    question: $('dQ').value.trim() || '(相談内容なし)',
    spread: sp.name,
    context: CTX[ctx],
    cards: picks.map((p,i)=>({
      position: sp.card_count>1 ? sp.positions[i].label : '答え',
      card: p.card.name,
      orientation: p.reversed ? '逆位置' : '正位置',
      meaning: (p.reversed?p.card.reversed:p.card.upright)[ctx],
      guidance: (p.reversed?p.card.reversed:p.card.upright).guidance
    }))
  };
  $('aiPanel').classList.remove('hide');
  $('aiOut').textContent=''; $('aiBtn').disabled=false;
}

/* ---- プロンプトをコピー ---- */
function buildPrompt(){
  const d = lastDraw;
  const cards = d.cards.map(c=>
    `■ ${c.position}\n${c.card}（${c.orientation}）\n意味：${c.meaning}\n指針：${c.guidance}`
  ).join('\n\n');
  return `以下のタロットの結果をもとに、鑑定文を書いてください。

【書き方の条件】
・${d.name}さんへの手紙として、名前で語りかける形で書く
・審判者ではなく、隣に立つ伴走者の姿勢で書く
・カードを1枚ずつ解説せず、全体をひとつながりの状況として描く
・カード名を並べ立てない
・逆位置を「悪い」と書かない。方向性の違いとして扱う
・困難な内容には必ず建設的な指針を添える
・見出しや記号（#、*、-）を使わず、散文で書く
・締めくくりは抽象的なムードではなく、具体的な日常の一場面で終える
・以下に書かれていない象徴（数秘、四大元素、カバラなど）を持ち出さない

【相談内容】
${d.question}

【引き方】${d.spread}
【読む文脈】${d.context}

${cards}`;
}

function copyPrompt(){
  if(!lastDraw) return;
  const txt = buildPrompt(), btn = $('copyBtn'), orig = 'プロンプトをコピー';
  const done = ok => { btn.textContent = ok ? 'コピーしました' : 'コピーできませんでした';
    setTimeout(()=>btn.textContent=orig, 1600); };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(()=>done(true),()=>fallback());
  } else fallback();
  function fallback(){
    const ta=document.createElement('textarea');
    ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta); done(ok);
  }
}

/* ---- AI 鑑定 ---- */
async function callAi(){
  if(!lastDraw) return;
  const btn=$('aiBtn'), out=$('aiOut');
  btn.disabled=true; out.className=''; out.textContent='鑑定文を準備しています...';
  try{
    const res = await fetch('/api/ai-fortune',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(lastDraw)
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf='';
    out.textContent='';
    while(true){
      const {done,value} = await reader.read();
      if(done) break;
      buf += dec.decode(value,{stream:true});
      out.textContent = buf.replace(/__WAITING__[\s\S]*?__END_WAITING__/g,'').replace(/\u200b/g,'');
    }
  }catch(e){
    out.className='err';
    out.textContent='API を呼び出せませんでした（'+e.message+'）。このページを itsuki-auto-fortune のリポジトリ直下に置いて本番で開くと動きます。';
  }
  btn.disabled=false;
}
